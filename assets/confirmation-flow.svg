<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="RedM Cache Cleaner v2 confirmation dialogs">
  <defs>
    <linearGradient id="desk2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171310"/>
      <stop offset="1" stop-color="#080706"/>
    </linearGradient>
    <linearGradient id="dlg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#221C18"/>
      <stop offset="1" stop-color="#17130F"/>
    </linearGradient>
    <linearGradient id="ic1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A6392A"/>
      <stop offset="1" stop-color="#7E271D"/>
    </linearGradient>
    <linearGradient id="ic2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B84234"/>
      <stop offset="1" stop-color="#7E271D"/>
    </linearGradient>
    <linearGradient id="pbtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A6392A"/>
      <stop offset="1" stop-color="#7E271D"/>
    </linearGradient>
    <filter id="sh2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="22" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#desk2)"/>

  <!-- ================= dialog 1: primary confirm ================= -->
  <g filter="url(#sh2)">
    <rect x="120" y="120" width="480" height="320" rx="16" fill="url(#dlg)" stroke="#8A6E4A" stroke-width="1.5"/>
  </g>
  <rect x="152" y="156" width="40" height="40" rx="9" fill="url(#ic1)"/>
  <text x="172" y="183" font-family="Segoe UI, sans-serif" font-size="20" fill="#F2E4CC" text-anchor="middle">?</text>
  <text x="208" y="183" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#F2E4CC">Confirm Cleanup</text>

  <text x="154" y="228" font-family="Segoe UI, sans-serif" font-size="14" fill="#E0CCAC">Delete these RedM cache folders?</text>
  <text x="172" y="258" font-family="Consolas, monospace" font-size="13.5" fill="#DBC59E">cache</text>
  <text x="172" y="282" font-family="Consolas, monospace" font-size="13.5" fill="#DBC59E">server-cache</text>
  <text x="172" y="306" font-family="Consolas, monospace" font-size="13.5" fill="#DBC59E">server-cache-priv</text>
  <text x="154" y="342" font-family="Segoe UI, sans-serif" font-size="13" fill="#B29A78">Close RedM first so files aren't locked.</text>

  <rect x="330" y="378" width="108" height="42" rx="8" fill="#2E2822" stroke="#4A3B2C"/>
  <text x="384" y="405" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#E0CCAC" text-anchor="middle">Cancel</text>
  <rect x="450" y="378" width="120" height="42" rx="8" fill="url(#pbtn)" stroke="#8A6E4A"/>
  <text x="510" y="405" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#F2E4CC" text-anchor="middle">Clean Now</text>

  <!-- arrow -->
  <path d="M 628 280 L 690 280" stroke="#8A6E4A" stroke-width="3" fill="none"/>
  <path d="M 684 272 L 694 280 L 684 288 Z" fill="#8A6E4A"/>
  <text x="659" y="266" font-family="Segoe UI, sans-serif" font-size="11" fill="#B29A78" text-anchor="middle">if</text>
  <text x="659" y="304" font-family="Segoe UI, sans-serif" font-size="11" fill="#B29A78" text-anchor="middle">nui</text>

  <!-- ================= dialog 2: danger nui confirm ================= -->
  <g filter="url(#sh2)">
    <rect x="720" y="120" width="480" height="320" rx="16" fill="url(#dlg)" stroke="#8A6E4A" stroke-width="1.5"/>
  </g>
  <rect x="752" y="156" width="40" height="40" rx="9" fill="url(#ic2)"/>
  <text x="772" y="184" font-family="Segoe UI, sans-serif" font-size="20" fill="#F2E4CC" text-anchor="middle">&#9888;</text>
  <text x="808" y="183" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#F2E4CC">Confirm nui-storage Deletion</text>

  <text x="754" y="230" font-family="Segoe UI, sans-serif" font-size="14" fill="#E0CCAC">You selected nui-storage.</text>
  <text x="754" y="262" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#E0CCAC">This can contain separate UI / browser</text>
  <text x="754" y="284" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#E0CCAC">storage data. Do you also want to delete</text>
  <text x="754" y="306" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#E0CCAC">the nui-storage folder?</text>

  <rect x="922" y="378" width="112" height="42" rx="8" fill="#2E2822" stroke="#4A3B2C"/>
  <text x="978" y="405" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#E0CCAC" text-anchor="middle">Keep It</text>
  <rect x="1046" y="378" width="122" height="42" rx="8" fill="url(#ic2)" stroke="#8A6E4A"/>
  <text x="1107" y="405" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#F2E4CC" text-anchor="middle">Delete It</text>

</svg>
